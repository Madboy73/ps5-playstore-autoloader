name: Build Playstore PS5 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Verify Playstore input assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/ps5_autoloader.zip
          test -f assets/icon0.png
          echo "d01bf00505618b100da772bae6535579bdbcfc79231585f7de61972aeba59b54  assets/ps5_autoloader.zip" | sha256sum -c -
          echo "43cd1b467750c9fae29fb2d914b0ba4e638b290cedd9037d8c26c1661dc80584  assets/icon0.png" | sha256sum -c -

      - name: Clone exact upstream WebKit v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch v0.3.0 --recursive https://github.com/itsPLK/ps5-webkit-autoloader.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "a86320f9bb9c0c52726703c4b87ad9e53a9e13a8"
          test "$(git -C upstream/third_party/ps5-unified-autoloader rev-parse HEAD)" = "78a6f0274f1581e233b69dd7dd4fd3b948a6d15c"

      - name: Prepare custom Unified Autoloader source
        shell: bash
        run: |
          set -euo pipefail
          U=upstream/third_party/ps5-unified-autoloader
          cp builder/playstore_restore.c "$U/src/playstore_restore.c"
          cp builder/playstore_restore.h "$U/include/playstore_restore.h"
          cp upstream/src/inflate.c "$U/src/inflate.c"
          cp upstream/src/inflate.h "$U/src/inflate.h"
          python3 builder/generate_pack.py assets/ps5_autoloader.zip --out-c "$U/src/playstore_default_pack.c" --out-h "$U/include/playstore_default_pack.h"
          python3 builder/apply_unified_changes.py "$U"
          curl -L --fail --retry 3 -o "$U/pldmgr.elf" https://github.com/itsPLK/ps5-payload-manager/releases/download/v0.5.1/pldmgr_v0.5.1.elf
          echo "05617c69ea145d1c11b8f7a6b7d3bd9e6df3831afd25d71a4ac85d63fb8e28aa  $U/pldmgr.elf" | sha256sum -c -
          git -C "$U" status --short
          git -C "$U" diff -- Makefile src/main.c

      - name: Host-test restore logic
        shell: bash
        run: |
          set -euo pipefail
          U=upstream/third_party/ps5-unified-autoloader
          cc -O2 -Wall -Wextra -I"$U/include" -I"$U/src" builder/host_test.c "$U/src/playstore_restore.c" "$U/src/playstore_default_pack.c" "$U/src/inflate.c" -o /tmp/playstore_restore_test
          sudo rm -rf /data/ps5_autoloader /data/homebrew
          sudo mkdir -p /data/homebrew
          echo KEEP_ME | sudo tee /data/homebrew/KEEP_ME.txt >/dev/null
          sudo /tmp/playstore_restore_test
          sudo python3 builder/verify_restored.py assets/ps5_autoloader.zip
          test "$(sudo cat /data/homebrew/KEEP_ME.txt)" = "KEEP_ME"
          sudo sed -i '/^pldmgr_v0\.5\.0\.elf$/d' /data/ps5_autoloader/autoload.txt
          BEFORE="$(sudo sha256sum /data/ps5_autoloader/autoload.txt | awk '{print $1}')"
          sudo /tmp/playstore_restore_test
          AFTER="$(sudo sha256sum /data/ps5_autoloader/autoload.txt | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          test "$(sudo cat /data/homebrew/KEEP_ME.txt)" = "KEEP_ME"

      - name: Build official PS5 SDK environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/Dockerfile.sdk'); s=p.read_text()
          old='RUN git clone https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk-source'
          new='RUN git clone --branch v0.42 --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk-source'
          if old not in s: raise SystemExit('SDK clone anchor missing')
          s=s.replace(old,new,1)
          old_dep='    unzip \\\n    librsvg2-bin \\'
          new_dep='    unzip \\\n    xxd \\\n    librsvg2-bin \\'
          if old_dep not in s: raise SystemExit('dependency anchor missing')
          p.write_text(s.replace(old_dep,new_dep,1))
          PY
          docker build -t ps5-webkit-autoloader-sdk -f upstream/Dockerfile.sdk upstream

      - name: Build custom Unified with PS5 SDK
        shell: bash
        run: |
          set -euo pipefail
          U="$PWD/upstream/third_party/ps5-unified-autoloader"
          docker run --rm -u "$(id -u):$(id -g)" -v "$U":/src -w /src ps5-webkit-autoloader-sdk make clean all
          test -s "$U/autoloader.elf"
          file "$U/autoloader.elf"

      - name: Prepare only requested branding
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE=stable -v "$PWD/upstream":/src -w /src ps5-webkit-autoloader-sdk make icons
          python3 builder/apply_branding.py upstream assets/icon0.png
          touch upstream/assets/icon0.png upstream/frontend/autoloader/logo.svg upstream/frontend/installer-page/logo.svg upstream/frontend/autoloader/favicon.svg upstream/frontend/installer-page/favicon.svg
          git -C upstream status --short
          git -C upstream diff -- assets/param.json.template frontend/autoloader/index.html frontend/installer-page/index.html

      - name: Stage custom Unified through upstream offline dependency path
        shell: bash
        run: |
          set -euo pipefail
          U=upstream/third_party/ps5-unified-autoloader
          DEST=upstream/frontend/autoloader/payloads/payload.elf
          mkdir -p "$(dirname "$DEST")"
          cp "$U/autoloader.elf" "$DEST"
          TAG="$(git -C "$U" describe --tags --always)"
          HASH="$(sha256sum "$DEST" | awk '{print $1}')"
          printf '%s %s\n' "$TAG" "$HASH" > "$DEST.sha256"

      - name: Build final installer ELF from v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE=stable -e FORCE_EXPLOIT=auto -e CUSTOM_VERSION= -v "$PWD/upstream":/src -w /src ps5-webkit-autoloader-sdk make clean all
          test -s upstream/installer.elf
          cp upstream/installer.elf webkit-autoloader-installer_PLAYSTORE_v0.3.0.elf
          FINAL_SHA="$(sha256sum webkit-autoloader-installer_PLAYSTORE_v0.3.0.elf | awk '{print $1}')"
          FINAL_SIZE="$(stat -c %s webkit-autoloader-installer_PLAYSTORE_v0.3.0.elf)"
          UNIFIED_SHA="$(sha256sum upstream/third_party/ps5-unified-autoloader/autoloader.elf | awk '{print $1}')"
          cat > BUILD_REPORT.txt <<EOF
          PLAYSTORE PS5 WebKit Autoloader build report
          Upstream WebKit: v0.3.0 / a86320f9bb9c0c52726703c4b87ad9e53a9e13a8
          Upstream Unified: 78a6f0274f1581e233b69dd7dd4fd3b948a6d15c / v0.1.3
          PS5 Payload SDK: v0.42 / 4eb701204fc3f8d31e84cf8ca272974e2be9c867
          Embedded Unified fallback Payload Manager: official v0.5.1
          Default restore package SHA256: d01bf00505618b100da772bae6535579bdbcfc79231585f7de61972aeba59b54
          Icon SHA256: 43cd1b467750c9fae29fb2d914b0ba4e638b290cedd9037d8c26c1661dc80584
          Custom Unified SHA256: $UNIFIED_SHA
          Final ELF size: $FINAL_SIZE
          Final ELF SHA256: $FINAL_SHA

          Intended runtime changes only:
          - create lowercase /data/homebrew if absent; never clear existing content
          - restore supplied /data/ps5_autoloader package only when /data/ps5_autoloader/autoload.txt is absent
          - original upstream config search, parser, payload launch timing and embedded Payload Manager fallback remain intact
          - Playstore icon/title/logo/contact branding
          - original WebKit exploit and offline cache/install behavior remain upstream v0.3.0
          EOF
          file webkit-autoloader-installer_PLAYSTORE_v0.3.0.elf
          cat BUILD_REPORT.txt

      - name: Upload final ELF
        uses: actions/upload-artifact@v4
        with:
          name: Playstore-WebKit-v0.3.0-ELF
          path: |
            webkit-autoloader-installer_PLAYSTORE_v0.3.0.elf
            BUILD_REPORT.txt
          if-no-files-found: error
          retention-days: 30
