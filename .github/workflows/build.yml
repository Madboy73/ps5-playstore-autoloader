name: Build Playstore PS5 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout branding repository
        uses: actions/checkout@v4

      - name: Verify branding assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/icon0.png
          test -s assets/playstore_bg.jpg
          file assets/icon0.png assets/playstore_bg.jpg

      - name: Clone exact official WebKit Autoloader v0.3.1-pre-3e9b02d
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/itsPLK/ps5-webkit-autoloader.git upstream
          git -C upstream checkout 3e9b02d49fedc54a26c66613a153df3b2e9909c2
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = "3e9b02d49fedc54a26c66613a153df3b2e9909c2"
          test "$(git -C upstream/third_party/ps5-unified-autoloader rev-parse HEAD)" = "955249d4c895ab1e9b7ae74e809da48e56a3f37c"
          grep -q '#define WKAL_VERSION "0.3.1"' upstream/include/wkali.h

      - name: Build official PS5 SDK environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/Dockerfile.sdk')
          s = p.read_text()
          old = 'RUN git clone https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk-source'
          new = 'RUN git clone --branch v0.42 --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk-source'
          if old not in s:
              raise SystemExit('SDK clone anchor missing')
          s = s.replace(old, new, 1)
          old_dep = '    unzip \\\n    librsvg2-bin \\'
          new_dep = '    unzip \\\n    xxd \\\n    librsvg2-bin \\'
          if old_dep not in s:
              raise SystemExit('dependency anchor missing')
          p.write_text(s.replace(old_dep, new_dep, 1))
          PY
          docker build -t ps5-webkit-autoloader-sdk -f upstream/Dockerfile.sdk upstream

      - name: Apply branding only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE=pre-release -e CUSTOM_VERSION=pre-3e9b02d -v "$PWD/upstream":/src -w /src ps5-webkit-autoloader-sdk make icons
          python3 builder/apply_branding.py upstream assets/icon0.png assets/playstore_bg.jpg
          touch upstream/assets/icon0.png \
                upstream/frontend/autoloader/logo.svg \
                upstream/frontend/installer-page/logo.svg \
                upstream/frontend/autoloader/favicon.svg \
                upstream/frontend/installer-page/favicon.svg \
                upstream/frontend/autoloader/playstore-bg.jpg \
                upstream/frontend/autoloader/style.css \
                upstream/frontend/autoloader/index.html \
                upstream/frontend/installer-page/index.html

      - name: Verify no runtime source was changed
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C upstream status --short -- src include tools third_party)"
          echo "Only branding/frontend files are modified:"
          git -C upstream status --short

      - name: Build final installer ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" \
            -e BUILD_TYPE=pre-release \
            -e FORCE_EXPLOIT=auto \
            -e CUSTOM_VERSION=pre-3e9b02d \
            -v "$PWD/upstream":/src -w /src \
            ps5-webkit-autoloader-sdk make clean all

          test -s upstream/installer.elf
          cp upstream/installer.elf webkit-autoloader-installer_PLAYSTORE_v0.3.1-pre-3e9b02d.elf

          FINAL_SHA="$(sha256sum webkit-autoloader-installer_PLAYSTORE_v0.3.1-pre-3e9b02d.elf | awk '{print $1}')"
          FINAL_SIZE="$(stat -c %s webkit-autoloader-installer_PLAYSTORE_v0.3.1-pre-3e9b02d.elf)"
          PAYLOAD_SHA="$(sha256sum upstream/frontend/autoloader/payloads/payload.elf | awk '{print $1}')"
          BG_SHA="$(sha256sum assets/playstore_bg.jpg | awk '{print $1}')"
          ICON_SHA="$(sha256sum assets/icon0.png | awk '{print $1}')"
          VERSION="$(docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE=pre-release -e CUSTOM_VERSION=pre-3e9b02d -v "$PWD/upstream":/src -w /src ps5-webkit-autoloader-sdk python3 tools/gen_version.py --print)"
          test "$VERSION" = "0.3.1-pre-3e9b02d"

          cat > BUILD_REPORT.txt <<EOF
          PLAYSTORE WebKit Autoloader v0.3.1-pre-3e9b02d - branding-only build
          Official upstream WebKit commit: 3e9b02d49fedc54a26c66613a153df3b2e9909c2
          Official pinned Unified commit: 955249d4c895ab1e9b7ae74e809da48e56a3f37c
          Runtime source changes: NONE
          Custom autoload/restore changes: NONE
          Default bundled Unified payload: upstream pinned release dependency
          Bundled payload SHA256: $PAYLOAD_SHA
          Branding changes only:
          - Playstore home title
          - supplied Playstore icon/logo
          - fullscreen Playstore background on Autoloader splash/loader page
          - existing splash logo/title/footer hidden because they are already rendered in the full-screen artwork
          Background SHA256: $BG_SHA
          Icon SHA256: $ICON_SHA
          Final version string: $VERSION
          Final ELF size: $FINAL_SIZE
          Final ELF SHA256: $FINAL_SHA
          EOF

          file webkit-autoloader-installer_PLAYSTORE_v0.3.1-pre-3e9b02d.elf
          cat BUILD_REPORT.txt

      - name: Upload final ELF
        uses: actions/upload-artifact@v4
        with:
          name: Playstore-WebKit-v0.3.1-pre-3e9b02d-Final-ELF
          path: |
            webkit-autoloader-installer_PLAYSTORE_v0.3.1-pre-3e9b02d.elf
            BUILD_REPORT.txt
          if-no-files-found: error
          retention-days: 30
